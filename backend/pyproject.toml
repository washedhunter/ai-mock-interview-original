[project]
name = "interview-api"
version = "0.1.0"
description = "Backend for the AI mock interview platform: accounts, Gemini question sets and scoring, Whisper transcription, history and progress."
license = "MIT"
authors = [{ name = "Kaif Attarwala" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.2",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.33",
    "google-genai>=3.3,<4",
    "tenacity>=9.1",
    "httpx>=0.28",
    "faster-whisper>=1.2.1,<2",
    "av>=16,<19",  # faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in PyAV 19
]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17"]

[project.scripts]
interview-api = "interview_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
