# docker compose up --build  ->  http://localhost:3000
name: ai-mock-interview

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview}
      POSTGRES_DB: interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        WHISPER_PRELOAD: ${WHISPER_MODEL:-base.en}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://interview:${POSTGRES_PASSWORD:-interview}@db:5432/interview
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
